services:
  postgres:
    image: postgres:17
    container_name: mercadopreso-db
    environment:
      POSTGRES_DB: mercadopreso
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mercadopreso-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mercadopreso"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mercadopreso-data:
